<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="Mahmoud Helal Software Testing and Automation QA">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <g fill="none" stroke="#38bdf8" opacity=".18">
    <path d="M0 230 H1200"/><path d="M0 170 H1200"/><path d="M0 110 H1200"/>
    <path d="M160 0 V300"/><path d="M320 0 V300"/><path d="M480 0 V300"/><path d="M640 0 V300"/><path d="M800 0 V300"/><path d="M960 0 V300"/>
  </g>
  <circle cx="1050" cy="72" r="38" fill="none" stroke="#38bdf8" stroke-width="2" opacity=".55">
    <animate attributeName="r" values="28;52;28" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".8;.05;.8" dur="3s" repeatCount="indefinite"/>
  </circle>
  <text x="72" y="92" fill="#e2e8f0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="600">MAHMOUD HELAL</text>
  <text x="72" y="145" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="42" font-weight="800">Software Tester · Automation QA</text>
  <text x="72" y="188" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20">Java · Selenium · TestNG · Cucumber · API · Performance · CI/CD</text>
  <g transform="translate(72 225)">
    <rect width="155" height="34" rx="17" fill="#0ea5e9" opacity=".16" stroke="#38bdf8"/>
    <text x="77" y="23" text-anchor="middle" fill="#7dd3fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">SDET JOURNEY</text>
  </g>
  <g transform="translate(250 225)">
    <rect width="175" height="34" rx="17" fill="#0ea5e9" opacity=".16" stroke="#38bdf8"/>
    <text x="87" y="23" text-anchor="middle" fill="#7dd3fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">QUALITY ENGINEERING</text>
  </g>
  <g filter="url(#glow)">
    <circle cx="1090" cy="220" r="7" fill="#38bdf8">
      <animate attributeName="cy" values="220;90;220" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
